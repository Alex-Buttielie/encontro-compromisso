name: Deploy PROD

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: |
          node --check server.js
          node --check routes/api.js
          node --check routes/pdf.js

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        run: gh release create ${{ steps.version.outputs.VERSION }} --title "Release ${{ steps.version.outputs.VERSION }}" --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to VPS (PROD)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            nvm use 20

            APP_DIR="/home/apps/coordenador-prod"
            BRANCH="main"
            PORT=3003
            ENV="production"

            echo "=== Deploy PROD ${{ steps.version.outputs.VERSION }} ==="

            # Pull latest main code
            cd "$APP_DIR"
            git fetch origin
            git reset --hard "origin/$BRANCH"

            # Install dependencies
            npm install --production

            # Restart PM2
            pm2 delete "coordenador-prod" 2>/dev/null || true
            PORT=$PORT NODE_ENV=$ENV pm2 start server.js --name "coordenador-prod"
            pm2 save

            echo "=== PROD ${{ steps.version.outputs.VERSION }} deployed on port $PORT ==="

      - name: Validate PROD
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            nvm use 20
            sleep 5
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3003/api/stats || echo "000")
            echo "HTTP Status: $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ PROD validation passed"
            else
              echo "❌ PROD validation FAILED - rolling back"
              pm2 logs coordenador-prod --lines 20 --nostream
              exit 1
            fi
            pm2 status coordenador-prod

      - name: Notify deployment success
        run: |
          echo "✅ Production deployment successful!"
          echo "Version: ${{ steps.version.outputs.VERSION }}"
          echo "URL: https://meucoordenador.com.br"
