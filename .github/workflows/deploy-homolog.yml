name: Deploy HOMOLOG

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  deploy-homolog:
    runs-on: ubuntu-latest
    environment:
      name: homolog
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: |
          node --check server.js
          node --check routes/api.js
          node --check routes/pdf.js

      - name: Deploy to VPS (HOMOLOG)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            nvm use 20

            APP_DIR="/home/apps/coordenador-homolog"
            BRANCH="develop"
            PORT=3002
            ENV="staging"

            echo "=== Deploy HOMOLOG ==="

            # Pull latest develop code into homolog
            cd "$APP_DIR"
            git fetch origin
            git reset --hard "origin/$BRANCH"

            # Install dependencies
            npm install --production

            # Restart PM2
            pm2 delete "coordenador-homolog" 2>/dev/null || true
            PORT=$PORT NODE_ENV=$ENV pm2 start server.js --name "coordenador-homolog"
            pm2 save

            echo "=== HOMOLOG deployed on port $PORT ==="

      - name: Validate HOMOLOG
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            nvm use 20
            sleep 3
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3002/api/stats || echo "000")
            echo "HTTP Status: $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ HOMOLOG validation passed"
            else
              echo "⚠️ HOMOLOG validation returned $HTTP_CODE"
            fi
            pm2 status coordenador-homolog

      - name: Comment PR with validation result
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 **Deploy de Homologação concluído!**\n\n- Ambiente: HOMOLOG (porta 3002)\n- URL: http://homolog.meucoordenador.com.br\n- Validação: ✅ App respondendo\n\n> O PR está pronto para merge para produção quando validado.'
            })
