name: Deploy DEV

on:
  push:
    branches: [develop]

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    needs: []
    environment:
      name: development
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: |
          node --check server.js
          node --check routes/api.js
          node --check routes/pdf.js

      - name: Deploy to VPS (DEV)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            nvm use 20

            APP_DIR="/home/apps/coordenador-dev"
            BRANCH="develop"
            PORT=3001
            ENV="development"

            echo "=== Deploy DEV ==="

            # Pull latest code
            cd "$APP_DIR"
            git fetch origin
            git reset --hard "origin/$BRANCH"

            # Install dependencies
            npm install --production

            # Restart PM2
            pm2 delete "coordenador-dev" 2>/dev/null || true
            PORT=$PORT NODE_ENV=$ENV pm2 start server.js --name "coordenador-dev"
            pm2 save

            echo "=== DEV deployed on port $PORT ==="

      - name: Validate DEV
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            sleep 3
            curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/api/stats || echo "Validation warning"
            echo ""
            pm2 status coordenador-dev
